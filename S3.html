<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape The Angry GF 😭❤️</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7);
    height:100vh;
}

h1{
    text-align:center;
    color:#ff3366;
    margin-top:15px;
}

#info{
    text-align:center;
    font-size:20px;
    color:#333;
}

#game{
    position:relative;
    width:100%;
    height:85vh;
}

#boy{
    position:absolute;
    font-size:55px;
    left:50%;
    top:70%;
    transition:0.08s;
}

.angry{
    position:absolute;
    font-size:45px;
    animation:drop 5s linear forwards;
}

.love{
    position:absolute;
    font-size:40px;
    animation:drop 5s linear forwards;
}

@keyframes drop{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(100vh);
    }
}

#final{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:30px;
    border-radius:25px;
    width:330px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

button{
    padding:12px 22px;
    border:none;
    border-radius:25px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<h1>🎮 Escape The Angry GF 😭❤️</h1>

<div id="info">
    Avoid Angry Faces 😡 and collect Hearts ❤️ <br>
    Hearts: <span id="score">0</span>/15
</div>

<div id="game">

    <div id="boy">🏃‍♂️</div>

    <div id="final">
        <h2>MISSION COMPLETE ❤️</h2>

        <p>
            You survived the girlfriend anger level 😭<br><br>

            Dear Love,<br>
            I know I messed up...<br>
            My mistake was bigger than my brain capacity 🥲<br><br>

            But I really care about you ❤️<br>
            Please forgive your loyal idiot 💖
        </p>

        <button onclick="alert('She smiled 😭❤️')">
            Forgive Him
        </button>
    </div>

</div>

<script>

const boy = document.getElementById("boy");
const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const finalBox = document.getElementById("final");

let score = 0;
let x = window.innerWidth / 2;

document.addEventListener("mousemove",(e)=>{
    x = e.clientX;
    boy.style.left = x + "px";
});

document.addEventListener("touchmove",(e)=>{
    x = e.touches[0].clientX;
    boy.style.left = x + "px";
});

function createObject(type){

    const obj = document.createElement("div");

    obj.classList.add(type);

    obj.innerHTML = type === "love" ? "❤️" : "😡";

    obj.style.left = Math.random() * (window.innerWidth - 60) + "px";

    game.appendChild(obj);

    const check = setInterval(()=>{

        const o = obj.getBoundingClientRect();
        const b = boy.getBoundingClientRect();

        if(
            o.bottom > b.top &&
            o.left < b.right &&
            o.right > b.left
        ){

            if(type === "love"){
                score++;
                scoreText.innerText = score;

                if(score >= 15){
                    winGame();
                }

            }else{
                score = Math.max(0, score - 2);
                scoreText.innerText = score;

                boy.innerHTML = "💀";

                setTimeout(()=>{
                    boy.innerHTML = "🏃‍♂️";
                },500);
            }

            obj.remove();
            clearInterval(check);
        }

    },50);

    setTimeout(()=>{
        obj.remove();
        clearInterval(check);
    },5000);
}

function winGame(){
    finalBox.style.display = "block";
}

setInterval(()=>{

    if(Math.random() > 0.4){
        createObject("love");
    }else{
        createObject("angry");
    }

},700);

</script>

</body>
</html>
